name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 语法检查
        # 酒馆助手以 <script type="module"> 执行脚本，按 module 语法检查
        run: for f in src/*.js; do node --input-type=module --check < "$f" || exit 1; done
      - name: 构建校验
        run: python scripts/build.py --check
